<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>دَعمة للحلول الرقمية | Daamah Digital Solutions</title>
    <meta name="description" content="دَعمة للحلول الرقمية — منذ 2018 نبني حضورًا رقميًا متكاملًا للشركات في السعودية والخليج وأوروبا: هوية بصرية، مواقع، سوشيال ميديا، وتسويق رقمي يحقق نتائج." />
    <meta name="theme-color" content="#fbfaf8" />
    <!--
      اللغة والسمة والحركة تُطبَّق قبل أول رسم — قبل الـ CSS وقبل React.
      بدونها يومض الاتجاه من RTL إلى LTR، وتومض الخلفية البيضاء قبل
      الوضع الداكن.

      اللغة تُقرأ من المسار لا من التخزين: `/en/...` إنجليزية وما عداها
      عربية. هذا هو مصدر الحقيقة نفسه الذي يستعمله i18n.tsx.

      وبعد أن صارت الصفحات تصل مرسومةً من البناء، صار لا بدّ أن تُفتح
      بوّابة الحركة هنا لا في main.tsx: المحتوى مرئيّ قبل أن تُحمَّل
      الحزمة، فلو انتظرنا جافاسكربت لظهر ثم قفز ليدخل.
    -->
    <script>
      (function () {
        var el = document.documentElement;
        var p = location.pathname;
        var en = p === "/en" || p.indexOf("/en/") === 0;
        el.lang = en ? "en" : "ar";
        el.dir = en ? "ltr" : "rtl";
        try {
          var saved = localStorage.getItem("daamah:theme");
          var dark =
            saved === "dark" ||
            (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
          el.dataset.theme = dark ? "dark" : "light";
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0c0c0e");
          }
        } catch (e) {
          el.dataset.theme = "light";
        }

        /* المحتوى ظاهر افتراضيًا؛ هذه الفئة هي ما يسمح للحركات بالعمل.
           لا نفعّلها والصفحة مخفية: الحركات لن تبدأ أصلًا فيبقى ما
           يعتمد عليها غير مرئي — من يفتح الموقع في تبويب خلفي كان
           يفقد كل الحركات، فننتظر أول ظهور للصفحة. */
        try {
          if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
            var on = function () {
              el.classList.add("anim-ready");
            };
            if (document.visibilityState === "visible") {
              on();
            } else {
              document.addEventListener("visibilitychange", function once() {
                if (document.visibilityState !== "visible") return;
                document.removeEventListener("visibilitychange", once);
                on();
              });
            }
          }
        } catch (e) {
          /* بلا حركة — المحتوى ظاهر على أي حال */
        }
      })();
    </script>
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* كشف ما يدخل الشاشة قبل أن يصل جافاسكربت التطبيق.
         الصفحة مرسومة من البناء، لكن `.reveal` يُخفي أقسامها حتى يعمل
         React ومراقبه — وحزمته كبيرة، فكان النص الظاهر على الجوال ينتظر
         نحو خمس ثوانٍ. هذا المراقب الصغير يعمل فور تحليل الصفحة بنفس
         شروط `useInView`؛ وحين يصل React يجد الفئة `in` موضوعة فلا يغيّر شيئًا. */
      (function () {
        try {
          var els = document.querySelectorAll("#root .reveal");
          if (!els.length || !("IntersectionObserver" in window)) return;
          var io = new IntersectionObserver(
            function (entries) {
              for (var i = 0; i < entries.length; i++) {
                if (entries[i].isIntersecting) {
                  entries[i].target.classList.add("in");
                  io.unobserve(entries[i].target);
                }
              }
            },
            { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
          );
          for (var j = 0; j < els.length; j++) io.observe(els[j]);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
